spring.application.name=cashapp

# Tests use an in-memory H2 database, so they run without Docker or PostgreSQL.
spring.datasource.url=jdbc:h2:mem:cashapp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
