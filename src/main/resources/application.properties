spring.application.name=cashapp

# PostgreSQL started by docker-compose.yml (host port 5434)
spring.datasource.url=jdbc:postgresql://localhost:5434/cashapp
spring.datasource.username=cashapp
spring.datasource.password=cashapp

# Hibernate creates/updates tables from the @Entity classes. Fine for learning;
# a production app would use a migration tool such as Flyway instead.
spring.jpa.hibernate.ddl-auto=update

# Close the database session when the service method ends, not when the HTTP response is written.
spring.jpa.open-in-view=false
