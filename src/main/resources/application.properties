spring.application.name=cashapp

# Read the database login from the git-ignored .env file (see .env.example).
# "optional:" means the app still starts if .env is missing, e.g. when the values come from real
# environment variables instead (that's how a server or CI would provide them).
spring.config.import=optional:file:.env[.properties]

# PostgreSQL started by docker-compose.yml (host port 5434)
spring.datasource.url=jdbc:postgresql://localhost:5434/cashapp
spring.datasource.username=${CASHAPP_DB_USERNAME}
spring.datasource.password=${CASHAPP_DB_PASSWORD}

# Hibernate creates/updates tables from the @Entity classes. Fine for learning;
# a production app would use a migration tool such as Flyway instead.
spring.jpa.hibernate.ddl-auto=update

# Close the database session when the service method ends, not when the HTTP response is written.
spring.jpa.open-in-view=false
